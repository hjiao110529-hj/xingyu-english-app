<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:calc(16px + env(safe-area-inset-top)) 18px 16px;background:var(--green);color:white;border-radius:0 0 22px 22px}header .top{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:0 0 5px;font-weight:750;letter-spacing:.3px}header p{margin:0;color:#e1ebe4;font-size:12px}.bell{border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:12px;padding:10px 12px;font-size:13px}.wrap{padding:16px;max-width:720px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:16px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:12px 10px;min-width:0}.stat span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.stat strong{font-size:25px;line-height:1.1}.stat.red strong{color:var(--red)}.stat.orange strong{color:var(--orange)}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;outline-color:var(--green)}.filter{border:1px solid var(--line);border-radius:12px;padding:0 9px;background:white;color:var(--ink);max-width:120px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 10px}.sectionhead h2{font-size:16px;margin:0}.muted{font-size:12px;color:var(--muted)}.orders{display:grid;gap:11px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 2px 7px #1d38240a}.card.urgent{background:var(--redbg);border-color:#f0b9b4}.card.soon{background:var(--orangebg);border-color:#f0d49a}.card.done{opacity:.8}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.orderid{font-size:16px;font-weight:750;overflow-wrap:anywhere}.pill{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--green2);color:var(--green)}.pill.red{background:#f9d7d3;color:var(--red)}.pill.orange{background:#ffe7b0;color:#875900}.pill.gray{background:#edf0ed;color:#69736c}.product{font-size:14px;font-weight:650;margin-top:10px}.specs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;color:#536057;background:#f2f5f1;border-radius:8px;padding:5px 7px}.datebox{margin-top:12px;padding-top:10px;border-top:1px solid #0000000d;display:flex;justify-content:space-between;gap:8px;align-items:center}.datebox b{font-size:13px}.datebox .date{font-size:13px;font-weight:700}.urgent .datebox .date,.urgent .datebox b{color:var(--red)}.soon .datebox .date,.soon .datebox b{color:var(--orange)}.actions{display:flex;gap:7px;margin-top:12px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 10px;font-size:12px;color:var(--ink);flex:1}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.soft{background:var(--green2);color:var(--green);border-color:transparent}.btn.danger{color:var(--red)}.empty{text-align:center;padding:34px 16px;color:var(--muted);background:white;border:1px dashed #ccd5cd;border-radius:16px}.empty .emoji{font-size:30px;margin-bottom:8px}.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:18px;left:18px;max-width:684px;margin:auto;border:0;border-radius:16px;padding:15px;background:var(--green);color:white;font-weight:750;box-shadow:0 7px 20px #2c503833;z-index:5}.overlay{display:none;position:fixed;inset:0;background:#14251bcc;z-index:10;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheethead h2{font-size:19px;margin:0}.x{border:0;background:#e8ede8;border-radius:50%;width:34px;height:34px;font-size:21px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#58655c;margin-bottom:6px;font-weight:650}.field input,.field textarea,.field select{width:100%;border:1px solid #dce3dc;border-radius:11px;background:white;padding:12px;outline-color:var(--green);min-width:0}.field textarea{min-height:75px;resize:vertical}.field input[type=file]{padding:9px;font-size:12px}.subhead{font-size:13px;font-weight:750;margin:20px 0 10px}.filelist{display:grid;gap:7px}.fileitem{background:white;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow-wrap:anywhere}.fileitem a{color:var(--green);font-weight:650}.fileitem button{border:0;background:none;color:var(--red)}.formactions{display:flex;gap:9px;margin-top:18px}.formactions .btn{padding:13px;font-size:14px}.notice{font-size:12px;line-height:1.6;color:#69746c;background:#edf2ed;border-radius:12px;padding:11px;margin-top:12px}.toast{position:fixed;z-index:30;bottom:95px;left:50%;transform:translateX(-50%);background:#24352a;color:white;padding:11px 15px;border-radius:12px;font-size:13px;max-width:90vw;display:none}.toast.show{display:block}.tabs{display:flex;gap:7px;margin-bottom:14px}.tab{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:white;font-size:12px;color:#536057}.tab.active{background:var(--green2);border-color:#bfd2c3;color:var(--green);font-weight:700}@media(min-width:600px){.orders{grid-template-columns:1fr 1fr}.overlay{align-items:center;padding:20px}.sheet{border-radius:22px;max-height:90vh}.fab{left:auto;width:230px}}

</head>
<body>
<header><div class="top"><div><h1>出货管家</h1><p>订单跟进 · 日期提醒 · 资料关联</p></div><button class="bell" id="notifyBtn">开启提醒</button></div></header>
<main class="wrap">
<div class="stats">
<div class="stat red"><span>今日 / 已逾期</span><strong id="urgentCount">0</strong></div>
<div class="stat orange"><span>两天内出货</span><strong id="soonCount">0</strong></div>
<div class="stat"><span>尚未出货</span><strong id="pendingCount">0</strong></div>
</div>
<div class="toolbar"><input class="search" id="search" placeholder="搜索订单号、品名、颜色…" autocomplete="off"><select class="filter" id="filter"><option value="pending">未出货</option><option value="all">全部订单</option><option value="urgent">今日 / 逾期</option><option value="soon">两天内</option><option value="done">已出货</option></select></div>
<div class="sectionhead"><h2 id="listTitle">订单跟进</h2><span class="muted" id="resultCount">0 个订单</span></div>
<div class="orders" id="orders"></div>
<div class="notice">提醒说明：打开本 APP 时会自动检查日期。允许通知后，应用处于可运行状态时可尝试弹出系统通知；如果 Safari / APP 完全关闭，普通网页无法保证准时响铃。重要订单请同时保留公司原有提醒方式。</div>
</main>
<button class="fab" id="addBtn">＋ 新增出货订单</button>
<div class="overlay" id="editor" role="dialog" aria-modal="true">
<div class="sheet">
<div class="sheethead"><h2 id="formTitle">新增订单</h2><button class="x" id="closeBtn" aria-label="关闭">×</button></div>
<form id="orderForm">
<input type="hidden" id="orderKey">
<div class="formgrid">
<div class="field full"><label for="orderNo">订单号 *</label><input id="orderNo" required maxlength="100" placeholder="例如：DD20261025"></div>
<div class="field full"><label for="productName">品名 *</label><input id="productName" required maxlength="150" placeholder="输入产品名称"></div>
<div class="field"><label for="spec">规格</label><input id="spec" maxlength="150" placeholder="尺寸、型号等"></div>
<div class="field"><label for="color">颜色</label><input id="color" maxlength="80" placeholder="例如：黑色"></div>
<div class="field"><label for="qty">要货数 *</label><input id="qty" required maxlength="60" placeholder="数量 / 单位"></div>
<div class="field"><label for="shipDate">计划出货日期 *</label><input id="shipDate" type="date" required></div>
<div class="field full"><label for="actualDate">实际出货日期（出货后填写）</label><input id="actualDate" type="date"></div>
</div>
<div class="subhead">关联资料（可选）</div>
<div class="formgrid">
<div class="field full"><label for="docUrl">在线文档链接</label><input id="docUrl" type="url" placeholder="粘贴在线文档 / 云文档网址"></div>
<div class="field full"><label for="files">添加 Excel 或 Word 文件</label><input id="files" type="file" multiple accept=".xlsx,.xls,.csv,.doc,.docx,.pdf,.numbers"></div>
</div>
<div class="filelist" id="attachedList" style="margin-top:9px"></div>
<div class="notice">订单和附件默认保存在当前手机的浏览器本地，不会自动同步到其他手机或电脑。请勿清理浏览器网站数据，否则本地订单和附件可能丢失。关联的在线文档需要你有对应的访问权限。</div>
<div class="formactions"><button class="btn" type="button" id="cancelBtn">取消</button><button class="btn primary" type="submit">保存订单</button></div>
</form>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const DB_NAME='shipment-manager-db', DB_VERSION=1, STORE='files';
let db=null, orders=[], pendingFiles=[], currentFiles=[], lastAlertKey='';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseDate=s=>{if(!s)return null;const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12,0,0,0)};
const daysUntil=s=>{const d=parseDate(s);if(!d)return null;return Math.round((d-parseDate(today()))/86400000)};
const fmt=s=>s? s.replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$1年$2月$3日'):'未填写';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(o){if(o.actualDate)return {text:'已实际出货',cls:'done',rank:4};const d=daysUntil(o.shipDate);if(d<0)return {text:'逾期 '+Math.abs(d)+' 天',cls:'urgent',rank:0};if(d===0)return {text:'今天出货',cls:'urgent',rank:0};if(d===1)return {text:'明天出货',cls:'urgent',rank:1};if(d===2)return {text:'后天出货',cls:'soon',rank:2};return {text:'待出货',cls:'',rank:3}}
function loadOrders(){try{orders=JSON.parse(localStorage.getItem('shipment-orders-v1')||'[]')}catch(e){orders=[]}if(!Array.isArray(orders))orders=[]}
function saveOrders(){localStorage.setItem('shipment-orders-v1',JSON.stringify(orders))}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){resolve(null);return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>{db=req.result;resolve(db)};req.onerror=()=>resolve(null)})}
function putFile(file,orderId){return new Promise((resolve,reject)=>{if(!db){resolve({id:'',name:file.name,type:file.type||'',size:file.size});return}const item={id:orderId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),orderId,name:file.name,type:file.type||'',size:file.size,blob:file};const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=()=>resolve({id:item.id,name:item.name,type:item.type,size:item.size});tx.onerror=()=>reject(tx.error)})}
function getFiles(orderId){return new Promise(resolve=>{if(!db){resolve([]);return}const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll();req.onsuccess=()=>resolve((req.result||[]).filter(x=>x.orderId===orderId));req.onerror=()=>resolve([])})}
function getFile(id){return new Promise(resolve=>{if(!db){resolve(null);return}const req=db.transaction(STORE,'readonly').objectStore(STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)})}
function delFile(id){return new Promise(resolve=>{if(!db||!id){resolve();return}const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=resolve})}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function playTone(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[880,660,880].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,c.currentTime+i*.22);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+i*.22+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.22+.18);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.22);o.stop(c.currentTime+i*.22+.2)});setTimeout(()=>c.close(),1000)}catch(e){}}
function checkReminders(){const relevant=orders.filter(o=>!o.actualDate&&daysUntil(o.shipDate)<=2);const key=today()+':'+relevant.map(o=>o.id).sort().join(',');if(relevant.length&&key!==lastAlertKey){lastAlertKey=key;const first=relevant[0],d=daysUntil(first.shipDate);toast('出货提醒：'+(d<0?'有订单已逾期':d===0?'有订单今天出货':d===1?'有订单明天出货':'有订单后天出货'));if(document.visibilityState==='visible')playTone();if('Notification'in window&&Notification.permission==='granted'){try{new Notification('出货管家提醒',{body:relevant.length+' 个订单将在两天内出货，请及时跟进。',icon:'./icon.svg'})}catch(e){}}}}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const pending=orders.filter(o=>!o.actualDate);$('urgentCount').textContent=pending.filter(o=>daysUntil(o.shipDate)<=0).length;$('soonCount').textContent=pending.filter(o=>daysUntil(o.shipDate)>=0&&daysUntil(o.shipDate)<=2).length;$('pendingCount').textContent=pending.length;
let list=orders.filter(o=>{const st=status(o);if(f==='pending'&&o.actualDate)return false;if(f==='done'&&!o.actualDate)return false;if(f==='urgent'&&!( !o.actualDate&&daysUntil(o.shipDate)<=0))return false;if(f==='soon'&&!( !o.actualDate&&daysUntil(o.shipDate)>=0&&daysUntil(o.shipDate)<=2))return false;const hay=[o.orderNo,o.productName,o.spec,o.color,o.qty].join(' ').toLowerCase();return !q||hay.includes(q)});
list.sort((a,b)=>{const sa=status(a),sb=status(b);if(sa.rank!==sb.rank)return sa.rank-sb.rank;return (a.shipDate||'').localeCompare(b.shipDate||'')});
$('resultCount').textContent=list.length+' 个订单';$('listTitle').textContent=f==='done'?'已出货订单':f==='all'?'全部订单':f==='urgent'?'今日 / 逾期':f==='soon'?'两天内出货':'订单跟进';
if(!list.length){$('orders').innerHTML='<div class="empty"><div class="emoji">📦</div><strong>这里还没有订单</strong><p>点击下方按钮，添加第一笔出货订单。</p></div>';return}
$('orders').innerHTML=list.map(o=>{const st=status(o),d=daysUntil(o.shipDate),pill=st.cls==='urgent'?'red':st.cls==='soon'?'orange':st.cls==='done'?'gray':'';return '<article class="card '+st.cls+'"><div class="cardtop"><div class="orderid">'+esc(o.orderNo)+'</div><span class="pill '+pill+'">'+esc(st.text)+'</span></div><div class="product">'+esc(o.productName)+'</div><div class="specs">'+(o.spec?'<span class="chip">规格：'+esc(o.spec)+'</span>':'')+(o.color?'<span class="chip">颜色：'+esc(o.color)+'</span>':'')+'<span class="chip">要货数：'+esc(o.qty)+'</span></div><div class="datebox"><div><div class="muted">计划出货日期</div><div class="date">'+esc(fmt(o.shipDate))+'</div></div><div style="text-align:right"><div class="muted">实际出货</div><b>'+(o.actualDate?esc(fmt(o.actualDate)):'未登记')+'</b></div></div>'+(o.docUrl?'<div style="margin-top:10px"><a href="'+esc(o.docUrl)+'" target="_blank" rel="noopener" style="color:var(--green);font-size:12px;font-weight:650">↗ 打开关联在线文档</a></div>':'')+'<div class="actions"><button class="btn soft" data-action="actual" data-id="'+esc(o.id)+'">'+(o.actualDate?'修改出货日期':'登记实际出货')+'</button><button class="btn" data-action="files" data-id="'+esc(o.id)+'">资料附件</button><button class="btn" data-action="edit" data-id="'+esc(o.id)+'">编辑</button></div></article>'}).join('');
}
function openEditor(o){$('orderForm').reset();pendingFiles=[];currentFiles=[];$('attachedList').innerHTML='';$('orderKey').value=o?o.id:'';$('formTitle').textContent=o?'编辑订单':'新增订单';if(o){for(const k of ['orderNo','productName','spec','color','qty','shipDate','actualDate','docUrl'])$(k).value=o[k]||'';getFiles(o.id).then(fs=>{currentFiles=fs;renderAttached()})}$('editor').classList.add('show');document.body.style.overflow='hidden';setTimeout(()=>$('orderNo').focus({preventScroll:true}),200)}
function closeEditor(){$('editor').classList.remove('show');document.body.style.overflow='';pendingFiles=[];currentFiles=[]}
function renderAttached(){$('attachedList').innerHTML=[...currentFiles.map(f=>'<div class="fileitem"><span>📎 '+esc(f.name)+'</span><button type="button" data-file-remove="'+esc(f.id)+'">移除</button></div>'),...pendingFiles.map((f,i)=>'<div class="fileitem"><span>📎 '+esc(f.name)+'（待保存）</span><button type="button" data-pending-remove="'+i+'">移除</button></div>')].join('')}
$('addBtn').addEventListener('click',()=>openEditor(null));$('closeBtn').addEventListener('click',closeEditor);$('cancelBtn').addEventListener('click',closeEditor);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);
$('files').addEventListener('change',e=>{pendingFiles.push(...Array.from(e.target.files||[]));renderAttached();e.target.value=''});
$('attachedList').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fileRemove){await delFile(b.dataset.fileRemove);currentFiles=currentFiles.filter(f=>f.id!==b.dataset.fileRemove);renderAttached()}if(b.dataset.pendingRemove!==undefined){pendingFiles.splice(Number(b.dataset.pendingRemove),1);renderAttached()}});
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('orderKey').value||('ord-'+Date.now()+'-'+Math.random().toString(36).slice(2,6));const o={id,orderNo:$('orderNo').value.trim(),productName:$('productName').value.trim(),spec:$('spec').value.trim(),color:$('color').value.trim(),qty:$('qty').value.trim(),shipDate:$('shipDate').value,actualDate:$('actualDate').value,docUrl:$('docUrl').value.trim(),updatedAt:new Date().toISOString()};if(!o.orderNo||!o.productName||!o.qty||!o.shipDate){toast('请填写带 * 的必填项目');return}if(orders.some(x=>x.orderNo.toLowerCase()===o.orderNo.toLowerCase()&&x.id!==id)){toast('这个订单号已存在，请检查');return}try{for(const file of pendingFiles){const f=await putFile(file,id);currentFiles.push(f)}const i=orders.findIndex(x=>x.id===id);if(i>=0)orders[i]=o;else orders.push(o);saveOrders();closeEditor();render();toast('订单已保存');checkReminders()}catch(err){toast('保存失败，请检查手机存储空间')}});
$('orders').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const o=orders.find(x=>x.id===b.dataset.id);if(!o)return;if(b.dataset.action==='edit'){openEditor(o);return}if(b.dataset.action==='actual'){const val=prompt('请输入实际出货日期（格式：YYYY-MM-DD）',o.actualDate||today());if(val===null)return;if(val&&!/^\d{4}-\d{2}-\d{2}$/.test(val)){toast('日期格式不正确，请使用 YYYY-MM-DD');return}o.actualDate=val;saveOrders();render();toast(val?'已登记实际出货日期':'已清除实际出货日期');return}if(b.dataset.action==='files'){const fs=await getFiles(o.id);let msg='订单：'+o.orderNo+'\n';if(o.docUrl)msg+='在线文档：'+o.docUrl+'\n';if(!fs.length&&!o.docUrl){toast('这笔订单还没有关联资料');return}if(fs.length){msg+='附件：\n'+fs.map((f,i)=>(i+1)+'. '+f.name).join('\n')+'\n\n输入附件编号打开，取消则返回。';const n=prompt(msg);if(n===null||n.trim()==='')return;const f=fs[Number(n)-1];if(!f){toast('附件编号无效');return}const full=await getFile(f.id);if(full&&full.blob){const url=URL.createObjectURL(full.blob);const a=document.createElement('a');a.href=url;a.download=f.name;a.target='_blank';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}else toast('附件暂不可读取，请重新添加')}else if(o.docUrl){window.open(o.docUrl,'_blank','noopener')}}});
$('notifyBtn').addEventListener('click',async()=>{if(!('Notification'in window)){toast('当前浏览器不支持系统通知；页面内提醒仍可使用');return}try{const p=await Notification.requestPermission();if(p==='granted'){toast('已允许系统通知；请保持 APP 可运行以便检查提醒')}else toast('未允许系统通知，仍可在打开 APP 时查看提醒')}catch(e){toast('请在浏览器设置中允许通知')}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkReminders();render()}});window.addEventListener('focus',()=>{checkReminders();render()});
loadOrders();openDB().then(()=>{render();checkReminders()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
</script>
</body>
</html>
